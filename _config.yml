# ---------------------------------------------------------------------------
# Alpha Threat Blog — Jekyll config
#
# GitHub Pages builds this natively; there is no CI step to maintain.
#
# Served from the custom domain blog.alphathreat.in (see the CNAME file), so
# baseurl is empty. If you ever move to a plain project URL such as
# cyberoutpost.github.io/alphathreat-blog, set baseurl to "/alphathreat-blog".
# ---------------------------------------------------------------------------

title: Alpha Threat Blog
tagline: Research, malware analysis & how-tos
description: >-
  Offensive-security research, malware analysis, pentest tradecraft and
  security awareness from the Alpha Threat team.
author: Alpha Threat
email: info@alphathreat.in

url: "https://blog.alphathreat.in"
baseurl: ""

# Link back to the main site (used by the nav and footer).
main_site: "https://alphathreat.in"

# No gem theme — the layouts in _layouts/ are the real alphathreat.in markup.
theme: null

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /:year/:month/:day/:title/
timezone: Asia/Kolkata

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Alpha Threat

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
