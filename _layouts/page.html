---
layout: default
---
<div class="page-hero">
  <div class="container">
    <ul class="crumbs">
      <li><a href="{{ '/' | relative_url }}">Blog</a></li>
      <li aria-current="page">{{ page.title | escape }}</li>
    </ul>
    <p class="eyebrow">{{ page.eyebrow | default: 'Alpha Threat Blog' }}</p>
    <h1>{{ page.title | escape }}</h1>
    {%- if page.description %}
    <p class="page-hero__lede">{{ page.description }}</p>
    {%- endif %}
  </div>
</div>

<div class="section section--tight">
  <div class="container">
    {{ content }}
  </div>
</div>
